[project]
name = "shiguang-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "imageio-ffmpeg>=0.8.0",
    "numpy>=2,<3",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pillow>=11,<13"]

# 告诉编辑器后端源码的位置，避免静态检查将 shiguang 标记为无法导入。
[tool.pyright]
extraPaths = ["apps/api"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
markers = ["media: real Remotion/FFmpeg output verification"]

